<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de recorrido</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="themecolor" content="#0a2a66">
<script>try{var t=localStorage.getItem("tema-recorrido");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--muted:#1b2a47;--line:#0a2a66;--accent:#0a2a66;--accent-ink:#fff;--btn-line:#0a2a66;--danger:#b00020;--route:#d63a2f;--go:#0b7a3b;--mid:#1d4ed8;--field:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#000;--card:#000;--ink:#fff;--muted:#bccbea;--line:#26478a;--accent:#0b3a8c;--accent-ink:#fff;--btn-line:#5b8be0;--danger:#ff7a85;--go:#2fbf71;--mid:#4d8dff;--field:#04080f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--accent);color:var(--accent-ink);padding:calc(12px + env(safe-area-inset-top,0)) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:21px;font-weight:800}
#tema{width:42px;height:42px;padding:0;border-radius:50%;font-size:22px;line-height:1;background:transparent;color:var(--accent-ink);border:2px solid var(--accent-ink)}
main{max-width:720px;margin:0 auto;padding:12px}
section{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:3px}
input,textarea{width:100%;font:inherit;font-weight:500;color:var(--ink);padding:10px;border:2px solid var(--line);border-radius:6px;background:var(--field)}
input::placeholder{color:var(--muted);opacity:.8}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--mid);outline-offset:1px}
textarea{min-height:220px;resize:vertical}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1}
button{font:inherit;font-weight:700;padding:11px 14px;border-radius:6px;border:2px solid var(--btn-line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--btn-line);color:var(--accent-ink)}
button.danger{border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
[hidden]{display:none!important}
.mapwrap{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden}
#map{height:55vh;min-height:320px;touch-action:none;background:#0b1a33}
#draw{position:absolute;left:0;top:0;z-index:450;pointer-events:none}
.drawing #draw{pointer-events:auto;touch-action:none;cursor:crosshair}
.drawing .leaflet-marker-icon{pointer-events:none!important}
.pinsvg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tools{margin-top:10px;padding:10px;border:2px dashed var(--line);border-radius:8px}
.seg,.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seg button{flex:1}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--btn-line)}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid var(--btn-line)}
.sw.on{outline:4px solid var(--mid);outline-offset:2px;border-color:var(--ink)}
.mapbtn{position:absolute;top:10px;right:10px;z-index:1000;padding:7px 11px;font-size:14px;background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.5)}
.info{display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--muted);margin:0 0 8px}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pin.mid{background:#1d4ed8}.pin.first{background:#0b7a3b}.pin.last{background:#d63a2f}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1;min-width:140px}
#msg{font-size:15px;font-weight:600;color:var(--muted);margin-top:8px;min-height:20px}
</style>
</head>
<body>
<header><h1>Informe de recorrido</h1><button type="button" id="tema" aria-label="Cambiar tema"></button></header>
<main>
<section>
  <h2>Datos del recorrido</h2>
  <div class="grid">
    <div><label for="fecha">Fecha</label><input type="date" id="fecha"></div>
    <div><label for="hora">Hora</label><input type="time" id="hora"></div>
    <div><label for="canton">Cantón</label><input id="canton" autocomplete="off"></div>
    <div><label for="distrito">Distrito</label><input id="distrito" autocomplete="off"></div>
    <div class="full"><label for="unidad">Unidad patrulla</label><input id="unidad" autocomplete="off"></div>
    <div class="full"><label for="chofer">Oficial chofer</label><input id="chofer" autocomplete="off"></div>
    <div class="full">
      <label>Oficiales asistentes</label>
      <div id="asistentes"></div>
      <button type="button" id="addAsist">Agregar otro asistente</button>
    </div>
  </div>
</section>

<section>
  <h2>Ruta</h2>
  <p class="info"><span id="npts">0 pines</span><span id="dist">0.00 km</span></p>
  <div class="mapwrap"><div id="map"></div><canvas id="draw"></canvas><button type="button" id="vista" class="mapbtn"></button></div>
  <div class="bar">
    <button type="button" id="undo">Deshacer último pin</button>
    <button type="button" id="locate">Mi ubicación</button>
    <button type="button" id="clear" class="danger">Borrar ruta</button>
  </div>
  <div class="bar">
    <button type="button" id="dibujar">✎ Dibujar</button>
    <button type="button" id="undoDib">Deshacer dibujo</button>
    <button type="button" id="clearDib" class="danger">Borrar dibujos</button>
  </div>
  <div class="tools" id="tools" hidden>
    <div class="seg" role="group" aria-label="Herramienta">
      <button type="button" data-tool="libre" class="on">Libre</button>
      <button type="button" data-tool="flecha">Flecha</button>
      <button type="button" data-tool="circulo">Círculo</button>
    </div>
    <div class="colors" role="group" aria-label="Color">
      <button type="button" class="sw on" data-color="#ffd60a" style="background:#ffd60a" aria-label="Amarillo"></button>
      <button type="button" class="sw" data-color="#00e5ff" style="background:#00e5ff" aria-label="Cian"></button>
      <button type="button" class="sw" data-color="#ffffff" style="background:#ffffff" aria-label="Blanco"></button>
      <button type="button" class="sw" data-color="#ff2bd6" style="background:#ff2bd6" aria-label="Magenta"></button>
      <button type="button" class="sw" data-color="#ff3b30" style="background:#ff3b30" aria-label="Rojo"></button>
    </div>
    <p class="info" style="margin:0">Dibuja con el dedo sobre el mapa. Para mover o acercar el mapa, toca "Terminar dibujo".</p>
  </div>
  <p class="info" style="margin-top:8px">Toca el mapa para colocar pines y armar la ruta. Arrastra un pin para moverlo.</p>
</section>

<section>
  <h2>Anotaciones</h2>
  <textarea id="notas" aria-label="Anotaciones"></textarea>
</section>

<section>
  <h2>Exportar</h2>
  <div class="actions">
    <button type="button" id="save" class="primary">Guardar JPG</button>
    <button type="button" id="share" hidden>Compartir</button>
    <button type="button" id="new" class="danger">Informe nuevo</button>
  </div>
  <div id="msg" role="status"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>
<script>
const $ = id => document.getElementById(id);
const FIELDS = ['fecha','hora','canton','distrito','unidad','chofer','notas'];
const KEY = 'informe-recorrido-v1';
let points = [];
let shapes = [];
let markers = [];

/* ---------- Tema ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('tema').textContent = t === 'dark' ? '☀' : '☾';
  $('tema').setAttribute('aria-label', t === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
  $('themecolor').content = t === 'dark' ? '#000000' : '#0a2a66';
}
$('tema').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('tema-recorrido', t); } catch (e) {}
};
applyTheme(document.documentElement.dataset.theme || 'light');

/* ---------- Mapa ---------- */
const map = L.map('map', {maxZoom: 19}).setView([9.93, -84.08], 8);
const baseSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, maxNativeZoom: 18, crossOrigin: true, attribution: 'Imagen © Esri, Maxar, Earthstar Geographics'
});
const labelsSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, maxNativeZoom: 18, crossOrigin: true
});
const baseOsm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, crossOrigin: true, attribution: '© OpenStreetMap'
});
let vista = 'sat';
try { vista = localStorage.getItem('vista-recorrido') === 'calles' ? 'calles' : 'sat'; } catch (e) {}
function setVista(v) {
  vista = v;
  [baseSat, labelsSat, baseOsm].forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
  if (v === 'sat') { baseSat.addTo(map); labelsSat.addTo(map); } else baseOsm.addTo(map);
  $('vista').textContent = v === 'sat' ? 'Ver calles' : 'Ver satélite';
  try { localStorage.setItem('vista-recorrido', v); } catch (e) {}
}
$('vista').onclick = () => setVista(vista === 'sat' ? 'calles' : 'sat');
setVista(vista);
const casing = L.polyline([], {color: '#ffffff', weight: 9, opacity: .85}).addTo(map);
const line = L.polyline([], {color: '#d63a2f', weight: 5, opacity: 1}).addTo(map);
function setLine() { casing.setLatLngs(points); line.setLatLngs(points); }
const markerLayer = L.layerGroup().addTo(map);
let me = null;

map.on('click', e => { points.push([e.latlng.lat, e.latlng.lng]); render(); save(); });

const PIN_PATH = 'M15 39C15 39 2 24 2 14.5A13 13 0 0 1 28 14.5C28 24 15 39 15 39Z';
const pinColor = (i, n) => i === 0 ? '#0b7a3b' : (i === n - 1 && n > 1 ? '#d63a2f' : '#1d4ed8');
function pinIcon(i, n) {
  return L.divIcon({
    className: '',
    html: `<svg class="pinsvg" width="30" height="40" viewBox="0 0 30 40"><path d="${PIN_PATH}" fill="${pinColor(i, n)}" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14.5" r="5" fill="#fff"/></svg>`,
    iconSize: [30, 40], iconAnchor: [15, 39]
  });
}

function render() {
  markerLayer.clearLayers();
  points.forEach((p, i) => {
    const m = L.marker(p, {icon: pinIcon(i, points.length), draggable: true}).addTo(markerLayer);
    m.on('drag', e => { const ll = e.target.getLatLng(); points[i] = [ll.lat, ll.lng]; setLine(); updateInfo(); });
    m.on('dragend', save);
  });
  setLine();
  updateInfo();
  redraw();
}

function totalKm() {
  let d = 0;
  for (let i = 1; i < points.length; i++) d += map.distance(points[i - 1], points[i]);
  return d / 1000;
}
function updateInfo() {
  $('npts').textContent = points.length + (points.length === 1 ? ' pin' : ' pines');
  $('dist').textContent = totalKm().toFixed(2) + ' km';
}

$('undo').onclick = () => { points.pop(); render(); save(); };
$('clear').onclick = () => { if (points.length && confirm('¿Borrar todos los pines de la ruta?')) { points = []; render(); save(); } };
$('locate').onclick = () => { setMsg('Buscando ubicación...'); map.locate({setView: true, maxZoom: 16, enableHighAccuracy: true}); };
map.on('locationfound', e => {
  if (me) me.remove();
  me = L.circleMarker(e.latlng, {radius: 8, color: '#fff', weight: 3, fillColor: '#2b5d8c', fillOpacity: 1}).addTo(map);
  setMsg('');
});
map.on('locationerror', () => setMsg('No se pudo obtener la ubicación. Revisa el permiso de ubicación del navegador.'));

/* ---------- Dibujo sobre el mapa ---------- */
const cv = $('draw'), cx = cv.getContext('2d');
let drawing = false, tool = 'libre', dcolor = '#ffd60a', temp = null, startPt = null, lastPt = null, curPt = null, rq = 0;

function paintShapes(ctx, list, proj, k) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  list.forEach(sh => {
    const w = 5 * k;
    const stroke = fn => {
      ctx.beginPath(); fn(); ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = w + 4 * k; ctx.stroke();
      ctx.beginPath(); fn(); ctx.strokeStyle = sh.c; ctx.lineWidth = w; ctx.stroke();
    };
    if (sh.t === 'libre') {
      const pts = sh.p.map(proj);
      if (pts.length < 2) return;
      stroke(() => pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
    } else if (sh.t === 'circulo') {
      const o = proj(sh.o), e = proj(sh.e), r = Math.hypot(e[0] - o[0], e[1] - o[1]);
      if (r < 1) return;
      stroke(() => ctx.arc(o[0], o[1], r, 0, Math.PI * 2));
    } else if (sh.t === 'flecha') {
      const a = proj(sh.a), b = proj(sh.b);
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 1) return;
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), hl = 22 * k;
      const bx = b[0] - Math.cos(ang) * hl * 0.7, by = b[1] - Math.sin(ang) * hl * 0.7;
      stroke(() => { ctx.moveTo(a[0], a[1]); ctx.lineTo(bx, by); });
      ctx.beginPath();
      ctx.moveTo(b[0], b[1]);
      ctx.lineTo(b[0] - hl * Math.cos(ang - 0.45), b[1] - hl * Math.sin(ang - 0.45));
      ctx.lineTo(b[0] - hl * Math.cos(ang + 0.45), b[1] - hl * Math.sin(ang + 0.45));
      ctx.closePath();
      ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 4 * k; ctx.stroke();
      ctx.fillStyle = sh.c; ctx.fill();
    }
  });
}
const projScreen = ll => { const q = map.latLngToContainerPoint(ll); return [q.x, q.y]; };
function paint() {
  const z = map.getSize(), dpr = window.devicePixelRatio || 1;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, z.x, z.y);
  paintShapes(cx, temp ? shapes.concat([temp]) : shapes, projScreen, 1);
}
function redraw() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; paint(); }); }
function sizeCanvas() {
  const z = map.getSize(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(z.x * dpr); cv.height = Math.round(z.y * dpr);
  cv.style.width = z.x + 'px'; cv.style.height = z.y + 'px';
  paint();
}
map.on('move zoom zoomend viewreset resize', redraw);
new ResizeObserver(() => { map.invalidateSize(); sizeCanvas(); }).observe($('map'));

const evPt = e => { const r = cv.getBoundingClientRect(); return L.point(e.clientX - r.left, e.clientY - r.top); };
const toLL = pt => { const ll = map.containerPointToLatLng(pt); return [ll.lat, ll.lng]; };
cv.addEventListener('pointerdown', e => {
  if (!drawing) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const pt = evPt(e), ll = toLL(pt);
  startPt = lastPt = curPt = pt;
  temp = tool === 'libre' ? {t: 'libre', c: dcolor, p: [ll]}
       : tool === 'flecha' ? {t: 'flecha', c: dcolor, a: ll, b: ll}
       : {t: 'circulo', c: dcolor, o: ll, e: ll};
  paint();
});
cv.addEventListener('pointermove', e => {
  if (!temp) return;
  const pt = evPt(e), ll = toLL(pt);
  curPt = pt;
  if (temp.t === 'libre') { if (pt.distanceTo(lastPt) > 3) { temp.p.push(ll); lastPt = pt; } }
  else if (temp.t === 'flecha') temp.b = ll;
  else temp.e = ll;
  paint();
});
function endDraw() {
  if (!temp) return;
  const ok = temp.t === 'libre' ? temp.p.length >= 2 : startPt.distanceTo(curPt) > 8;
  if (ok) { shapes.push(temp); save(); }
  temp = null; paint();
}
cv.addEventListener('pointerup', endDraw);
cv.addEventListener('pointercancel', endDraw);

$('dibujar').onclick = () => {
  drawing = !drawing;
  $('map').parentElement.classList.toggle('drawing', drawing);
  $('tools').hidden = !drawing;
  $('dibujar').classList.toggle('on', drawing);
  $('dibujar').textContent = drawing ? 'Terminar dibujo' : '✎ Dibujar';
};
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
  dcolor = b.dataset.color;
  document.querySelectorAll('[data-color]').forEach(x => x.classList.toggle('on', x === b));
});
$('undoDib').onclick = () => { shapes.pop(); save(); paint(); };
$('clearDib').onclick = () => { if (shapes.length && confirm('¿Borrar todos los dibujos del mapa?')) { shapes = []; save(); paint(); } };
function boundsPoints() {
  const out = points.slice();
  shapes.forEach(sh => {
    if (sh.t === 'libre') out.push(...sh.p);
    else if (sh.t === 'flecha') out.push(sh.a, sh.b);
    else out.push(sh.o, sh.e, [2 * sh.o[0] - sh.e[0], 2 * sh.o[1] - sh.e[1]]);
  });
  return out;
}

/* ---------- Asistentes ---------- */
function addAsistente(v = '') {
  const row = document.createElement('div');
  row.className = 'row';
  const inp = document.createElement('input');
  inp.autocomplete = 'off';
  inp.value = v;
  inp.addEventListener('input', save);
  const del = document.createElement('button');
  del.type = 'button'; del.textContent = 'Quitar';
  del.onclick = () => { row.remove(); if (!$('asistentes').children.length) addAsistente(); relabel(); save(); };
  row.append(inp, del);
  $('asistentes').appendChild(row);
  relabel();
}
function relabel() {
  [...$('asistentes').children].forEach((r, i) => r.firstChild.setAttribute('aria-label', 'Oficial asistente ' + (i + 1)) || (r.firstChild.placeholder = 'Oficial asistente ' + (i + 1)));
}
function asistentes() { return [...$('asistentes').querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean); }
$('addAsist').onclick = () => { addAsistente(); $('asistentes').lastChild.firstChild.focus(); };

/* ---------- Guardado local ---------- */
function save() {
  const d = {points, shapes, asistentes: [...$('asistentes').querySelectorAll('input')].map(i => i.value)};
  FIELDS.forEach(f => d[f] = $(f).value);
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (d) {
    FIELDS.forEach(f => $(f).value = d[f] || '');
    points = d.points || [];
    shapes = d.shapes || [];
    (d.asistentes && d.asistentes.length ? d.asistentes : ['']).forEach(a => addAsistente(a));
  } else {
    addAsistente();
    setNow();
  }
  render();
  if (points.length > 1) map.fitBounds(L.latLngBounds(points), {padding: [30, 30]});
}
function setNow() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  $('fecha').value = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
  $('hora').value = `${p(n.getHours())}:${p(n.getMinutes())}`;
}
FIELDS.forEach(f => $(f).addEventListener('input', save));
$('new').onclick = () => {
  if (!confirm('¿Empezar un informe nuevo? Se borrarán los datos actuales.')) return;
  FIELDS.forEach(f => $(f).value = '');
  $('asistentes').innerHTML = ''; addAsistente();
  points = []; shapes = []; setNow(); render(); save();
};

/* ---------- Exportar JPG ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitTiles() {
  await sleep(300);
  for (let i = 0; i < 30; i++) {
    if ([...document.querySelectorAll('#map .leaflet-tile')].every(t => t.complete)) return;
    await sleep(150);
  }
}
function setMsg(t) { $('msg').textContent = t; }

function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let cur = '';
    par.split(/\s+/).forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) cur = t;
      else {
        if (cur) out.push(cur);
        while (ctx.measureText(w).width > maxW) {
          let k = w.length; while (k > 1 && ctx.measureText(w.slice(0, k)).width > maxW) k--;
          out.push(w.slice(0, k)); w = w.slice(k);
        }
        cur = w;
      }
    });
    out.push(cur);
  });
  return out;
}
async function geocode(p) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 7000);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=es&lat=${p[0]}&lon=${p[1]}`, {signal: ac.signal});
    if (!r.ok) return null;
    const j = await r.json();
    return j.address || null;
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}
const fmtCoord = p => `${p[0].toFixed(5)}, ${p[1].toFixed(5)}`;

function routePointAt(fr) {
  if (points.length === 1) return points[0];
  const segs = []; let tot = 0;
  for (let i = 1; i < points.length; i++) { const d = map.distance(points[i - 1], points[i]); segs.push(d); tot += d; }
  if (!tot) return points[0];
  let t = fr * tot;
  for (let i = 0; i < segs.length; i++) {
    if (t <= segs[i] || i === segs.length - 1) {
      const k = segs[i] ? Math.min(1, t / segs[i]) : 0, a = points[i], b = points[i + 1];
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    }
    t -= segs[i];
  }
}
function parseAddr(a) {
  const first = keys => { for (const k of keys) if (a[k]) return a[k]; return ''; };
  const provincia = (a.state || a.region || '').replace(/^provincia\s+(de\s+)?/i, '').trim();
  let canton = (a.county || '').replace(/^cant[oó]n\s+(de\s+)?/i, '').trim();
  const barrio = first(['neighbourhood', 'quarter', 'hamlet', 'suburb']);
  let distrito = first(['city_district', 'municipality', 'town', 'village']);
  if (!distrito && a.suburb && a.suburb !== barrio) distrito = a.suburb;
  if (!canton) canton = a.city || '';
  else if (!distrito && a.city && a.city !== canton) distrito = a.city;
  distrito = distrito.replace(/^distrito\s+(de\s+)?/i, '').trim();
  return {barrio, distrito, canton, provincia};
}
const uniq = arr => arr.filter((v, i) => v && arr.indexOf(v) === i);
function rango(list) {
  if (!list.length) return '';
  if (list.length === 1) return list[0];
  const mid = list.slice(1, -1);
  return `de ${list[0]} a ${list[list.length - 1]}` + (mid.length ? ` (pasando por ${mid.join(', ')})` : '');
}
async function describeRoute() {
  const km = totalKm();
  const n = points.length === 1 ? 1 : Math.max(2, Math.min(7, Math.ceil(km / 1.5) + 1));
  const res = [];
  for (let i = 0; i < n; i++) {
    setMsg(`Buscando ubicación de la ruta (${i + 1}/${n})...`);
    if (i) await sleep(1100);
    const a = await geocode(routePointAt(n === 1 ? 0 : i / (n - 1)));
    if (a) res.push(parseAddr(a));
  }
  setMsg('Generando imagen...');
  return {
    coords: fmtCoord(routePointAt(0.5)),
    found: res.length > 0,
    barrio: rango(uniq(res.map(r => r.barrio))),
    distrito: rango(uniq(res.map(r => r.distrito))),
    canton: rango(uniq(res.map(r => r.canton))),
    provincia: rango(uniq(res.map(r => r.provincia)))
  };
}
function fmtFecha(v) { if (!v) return '—'; const [y, m, d] = v.split('-'); return `${d}/${m}/${y}`; }

async function buildJpg() {
  const bp = boundsPoints();
  if (bp.length > 1) map.fitBounds(L.latLngBounds(bp), {padding: [30, 30], maxZoom: 18, animate: false});
  else if (bp.length === 1) map.setView(bp[0], 16, {animate: false});
  await waitTiles();

  const info = points.length ? await describeRoute() : null;

  const W = 1200, P = 40, IW = W - P * 2;
  const mapEl = $('map'), r = mapEl.getBoundingClientRect();
  const s = IW / r.width, MH = Math.round(r.height * s);
  const measure = document.createElement('canvas').getContext('2d');

  const val = id => $(id).value.trim() || '—';
  const pairs = [['Fecha', fmtFecha($('fecha').value), 'Hora', val('hora')],
                 ['Cantón', val('canton'), 'Distrito', val('distrito')],
                 ['Unidad patrulla', val('unidad'), 'Oficial chofer', val('chofer')]];
  const asis = asistentes();
  measure.font = '28px sans-serif';
  const asisLines = wrap(measure, asis.length ? asis.join(', ') : '—', IW);
  const notes = $('notas').value.trim();
  const noteLines = wrap(measure, notes || 'Sin anotaciones.', IW);

  const HEAD = 100, ROW = 84, LH = 36;
  const hInfo = pairs.length * ROW + 30 + asisLines.length * LH + 20;
  const hMap = 56 + MH + 24;
  const hNotes = 56 + noteLines.length * LH + 24;
  measure.font = '24px sans-serif';
  const locRows = [];
  if (info) {
    locRows.push(['Coordenadas', info.coords]);
    if (info.found && (info.barrio || info.distrito || info.canton || info.provincia)) {
      if (info.barrio) locRows.push(['Sector/barrio', info.barrio]);
      if (info.distrito) locRows.push(['Distrito', info.distrito]);
      if (info.canton) locRows.push(['Cantón', info.canton]);
      if (info.provincia) locRows.push(['Provincia', info.provincia]);
    } else locRows.push(['Ubicación', 'No disponible (sin conexión)']);
  }
  const rows = locRows.map(([label, text]) => ({label, lines: wrap(measure, text, IW - 230)}));
  const hLoc = rows.length ? 44 + rows.reduce((a, r) => a + r.lines.length * 30 + 6, 0) + 14 : 0;
  const H = HEAD + 24 + hInfo + hMap + hLoc + hNotes + 56;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#1c2b3a'; ctx.fillRect(0, 0, W, HEAD);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif';
  ctx.fillText('INFORME DE RECORRIDO', P, 64);

  let y = HEAD + 24;
  const colW = (IW - 30) / 2;
  pairs.forEach(row => {
    [[row[0], row[1], P], [row[2], row[3], P + colW + 30]].forEach(([l, v, x]) => {
      ctx.fillStyle = '#5d6b78'; ctx.font = '22px sans-serif'; ctx.fillText(l, x, y + 24);
      ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 30px sans-serif';
      let t = v; while (ctx.measureText(t).width > colW && t.length > 1) t = t.slice(0, -1);
      ctx.fillText(t === v ? v : t + '…', x, y + 60);
    });
    y += ROW;
  });
  ctx.fillStyle = '#5d6b78'; ctx.font = '22px sans-serif';
  ctx.fillText(asis.length > 1 ? 'Oficiales asistentes' : 'Oficial asistente', P, y + 24);
  ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 28px sans-serif';
  asisLines.forEach((t, i) => ctx.fillText(t, P, y + 62 + i * LH));
  y += 30 + asisLines.length * LH + 20;

  ctx.strokeStyle = '#d5dbe1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke();
  ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText('Mapa del recorrido', P, y + 42);
  ctx.textAlign = 'right'; ctx.font = '26px sans-serif'; ctx.fillStyle = '#5d6b78';
  ctx.fillText(`${points.length} ${points.length === 1 ? 'pin' : 'pines'} · ${totalKm().toFixed(2)} km`, W - P, y + 42);
  ctx.textAlign = 'left';
  const my = y + 56;

  ctx.save();
  ctx.beginPath(); ctx.rect(P, my, IW, MH); ctx.clip();
  ctx.fillStyle = '#e8ecef'; ctx.fillRect(P, my, IW, MH);
  mapEl.querySelectorAll('.leaflet-tile-pane .leaflet-layer').forEach(layer => {
    const conts = [...layer.querySelectorAll('.leaflet-tile-container')]
      .sort((x, y) => (+x.style.zIndex || 0) - (+y.style.zIndex || 0));
    ctx.globalAlpha = layer.style.opacity === '' ? 1 : parseFloat(layer.style.opacity);
    conts.forEach(cont => cont.querySelectorAll('img.leaflet-tile').forEach(img => {
      if (!img.complete || !img.naturalWidth) return;
      const b = img.getBoundingClientRect();
      ctx.drawImage(img, P + (b.left - r.left) * s, my + (b.top - r.top) * s, b.width * s + 1, b.height * s + 1);
    }));
    ctx.globalAlpha = 1;
  });
  const proj = p => { const q = map.latLngToContainerPoint(p); return [P + q.x * s, my + q.y * s]; };
  if (points.length > 1) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    points.forEach((p, i) => { const [x, yy] = proj(p); i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); });
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 9 * s; ctx.stroke();
    ctx.strokeStyle = '#d63a2f'; ctx.lineWidth = 5 * s; ctx.stroke();
  }
  const pinPath = new Path2D(PIN_PATH);
  points.forEach((p, i) => {
    const [x, yy] = proj(p), k = s * 0.8;
    ctx.save();
    ctx.translate(x - 15 * k, yy - 39 * k); ctx.scale(k, k);
    ctx.fillStyle = pinColor(i, points.length); ctx.fill(pinPath);
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(pinPath);
    ctx.beginPath(); ctx.arc(15, 14.5, 5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  });
  paintShapes(ctx, shapes, proj, s);
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = '#d5dbe1'; ctx.lineWidth = 2; ctx.strokeRect(P, my, IW, MH);

  y = my + MH + 24;
  if (rows.length) {
    ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 28px sans-serif';
    ctx.fillText('Ubicación aproximada de la ruta', P, y + 28);
    y += 44;
    rows.forEach(r => {
      ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#5d6b78';
      ctx.fillText(r.label, P, y + 22);
      ctx.font = '24px sans-serif'; ctx.fillStyle = '#1c2b3a';
      r.lines.forEach((t, i) => ctx.fillText(t, P + 230, y + 22 + i * 30));
      y += r.lines.length * 30 + 6;
    });
    y += 14;
  }
  ctx.strokeStyle = '#d5dbe1';
  ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke();
  ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText('Anotaciones', P, y + 42);
  ctx.font = '28px sans-serif'; ctx.fillStyle = notes ? '#1c2b3a' : '#5d6b78';
  noteLines.forEach((t, i) => ctx.fillText(t, P, y + 56 + 30 + i * LH));

  ctx.fillStyle = '#5d6b78'; ctx.font = '20px sans-serif';
  const now = new Date();
  ctx.fillText(`Generado ${now.toLocaleString('es-CR')} · ` + (vista === 'sat' ? 'Imagen © Esri, Maxar, Earthstar Geographics · Direcciones © OpenStreetMap' : 'Mapa y direcciones © OpenStreetMap'), P, H - 22);

  return new Promise((res, rej) => {
    try { c.toBlob(b => b ? res(b) : rej(new Error('vacío')), 'image/jpeg', 0.92); } catch (e) { rej(e); }
  });
}

function fileName() {
  const limpio = t => t.trim().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
  const d = limpio($('distrito').value) || 'SinDistrito';
  const f = $('fecha').value || 'sin-fecha';
  const h = ($('hora').value || 'sin-hora').replace(':', '');
  return `${d}-${f}-${h}.jpg`;
}

async function exportar(modo) {
  const btns = [$('save'), $('share')];
  btns.forEach(b => b.disabled = true);
  setMsg('Generando imagen...');
  try {
    const blob = await buildJpg();
    const file = new File([blob], fileName(), {type: 'image/jpeg'});
    if (modo === 'share') {
      try { await navigator.share({files: [file], title: 'Informe de recorrido'}); setMsg('Listo.'); }
      catch (e) { setMsg(e.name === 'AbortError' ? '' : 'No se pudo compartir.'); }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      setMsg('Imagen guardada: ' + file.name);
    }
  } catch (e) {
    setMsg('No se pudo generar la imagen. Verifica la conexión para cargar el mapa e intenta de nuevo.');
  }
  btns.forEach(b => b.disabled = false);
}
$('save').onclick = () => exportar('save');
$('share').onclick = () => exportar('share');
try {
  const t = new File([''], 't.jpg', {type: 'image/jpeg'});
  if (navigator.canShare && navigator.canShare({files: [t]})) $('share').hidden = false;
} catch (e) {}

load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
