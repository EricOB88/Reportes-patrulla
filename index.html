<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de recorrido</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2b3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous">
<style>
:root{--ink:#1c2b3a;--paper:#f3f5f7;--card:#fff;--line:#d5dbe1;--route:#d63a2f;--go:#1f8a4c;--mid:#2b5d8c;--muted:#5d6b78}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px}
header h1{margin:0;font-size:20px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input,textarea{width:100%;font:inherit;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
textarea{min-height:220px;resize:vertical}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1}
button{font:inherit;font-weight:600;padding:11px 14px;border-radius:6px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:#fff}
button.danger{border-color:var(--route);color:var(--route)}
button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#map{height:55vh;min-height:320px;border-radius:6px;border:1px solid var(--line);touch-action:none}
.info{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 0 8px}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin.mid{background:var(--mid)}.pin.first{background:var(--go)}.pin.last{background:var(--route)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1;min-width:140px}
#msg{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
</style>
</head>
<body>
<header><h1>Informe de recorrido</h1></header>
<main>
<section>
  <h2>Datos del recorrido</h2>
  <div class="grid">
    <div><label for="fecha">Fecha</label><input type="date" id="fecha"></div>
    <div><label for="hora">Hora</label><input type="time" id="hora"></div>
    <div><label for="canton">Cantón</label><input id="canton" autocomplete="off"></div>
    <div><label for="distrito">Distrito</label><input id="distrito" autocomplete="off"></div>
    <div class="full"><label for="unidad">Unidad patrulla</label><input id="unidad" autocomplete="off"></div>
    <div class="full"><label for="chofer">Oficial chofer</label><input id="chofer" autocomplete="off"></div>
    <div class="full">
      <label>Oficiales asistentes</label>
      <div id="asistentes"></div>
      <button type="button" id="addAsist">Agregar otro asistente</button>
    </div>
  </div>
</section>

<section>
  <h2>Ruta</h2>
  <p class="info"><span id="npts">0 puntos</span><span id="dist">0.00 km</span></p>
  <div id="map"></div>
  <div class="bar">
    <button type="button" id="undo">Deshacer último punto</button>
    <button type="button" id="locate">Mi ubicación</button>
    <button type="button" id="clear" class="danger">Borrar ruta</button>
  </div>
  <p class="info" style="margin-top:8px">Toca el mapa para agregar puntos. Arrastra un punto para moverlo.</p>
</section>

<section>
  <h2>Anotaciones</h2>
  <textarea id="notas" aria-label="Anotaciones"></textarea>
</section>

<section>
  <h2>Exportar</h2>
  <div class="actions">
    <button type="button" id="save" class="primary">Guardar JPG</button>
    <button type="button" id="share" hidden>Compartir</button>
    <button type="button" id="new" class="danger">Informe nuevo</button>
  </div>
  <div id="msg" role="status"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>
<script>
const $ = id => document.getElementById(id);
const FIELDS = ['fecha','hora','canton','distrito','unidad','chofer','notas'];
const KEY = 'informe-recorrido-v1';
let points = [];
let markers = [];

/* ---------- Mapa ---------- */
const map = L.map('map').setView([9.93, -84.08], 8);
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, crossOrigin: true, attribution: '© OpenStreetMap'
}).addTo(map);
const line = L.polyline([], {color: '#d63a2f', weight: 5, opacity: .9}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);
let me = null;

map.on('click', e => { points.push([e.latlng.lat, e.latlng.lng]); render(); save(); });

function pinIcon(i, n) {
  const cls = i === 0 ? 'first' : (i === n - 1 && n > 1 ? 'last' : 'mid');
  return L.divIcon({className: '', html: `<div class="pin ${cls}">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13]});
}

function render() {
  markerLayer.clearLayers();
  points.forEach((p, i) => {
    const m = L.marker(p, {icon: pinIcon(i, points.length), draggable: true}).addTo(markerLayer);
    m.on('drag', e => { const ll = e.target.getLatLng(); points[i] = [ll.lat, ll.lng]; line.setLatLngs(points); updateInfo(); });
    m.on('dragend', save);
  });
  line.setLatLngs(points);
  updateInfo();
}

function totalKm() {
  let d = 0;
  for (let i = 1; i < points.length; i++) d += map.distance(points[i - 1], points[i]);
  return d / 1000;
}
function updateInfo() {
  $('npts').textContent = points.length + (points.length === 1 ? ' punto' : ' puntos');
  $('dist').textContent = totalKm().toFixed(2) + ' km';
}

$('undo').onclick = () => { points.pop(); render(); save(); };
$('clear').onclick = () => { if (points.length && confirm('¿Borrar todos los puntos de la ruta?')) { points = []; render(); save(); } };
$('locate').onclick = () => { setMsg('Buscando ubicación...'); map.locate({setView: true, maxZoom: 16, enableHighAccuracy: true}); };
map.on('locationfound', e => {
  if (me) me.remove();
  me = L.circleMarker(e.latlng, {radius: 8, color: '#fff', weight: 3, fillColor: '#2b5d8c', fillOpacity: 1}).addTo(map);
  setMsg('');
});
map.on('locationerror', () => setMsg('No se pudo obtener la ubicación. Revisa el permiso de ubicación del navegador.'));

/* ---------- Asistentes ---------- */
function addAsistente(v = '') {
  const row = document.createElement('div');
  row.className = 'row';
  const inp = document.createElement('input');
  inp.autocomplete = 'off';
  inp.value = v;
  inp.addEventListener('input', save);
  const del = document.createElement('button');
  del.type = 'button'; del.textContent = 'Quitar';
  del.onclick = () => { row.remove(); if (!$('asistentes').children.length) addAsistente(); relabel(); save(); };
  row.append(inp, del);
  $('asistentes').appendChild(row);
  relabel();
}
function relabel() {
  [...$('asistentes').children].forEach((r, i) => r.firstChild.setAttribute('aria-label', 'Oficial asistente ' + (i + 1)) || (r.firstChild.placeholder = 'Oficial asistente ' + (i + 1)));
}
function asistentes() { return [...$('asistentes').querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean); }
$('addAsist').onclick = () => { addAsistente(); $('asistentes').lastChild.firstChild.focus(); };

/* ---------- Guardado local ---------- */
function save() {
  const d = {points, asistentes: [...$('asistentes').querySelectorAll('input')].map(i => i.value)};
  FIELDS.forEach(f => d[f] = $(f).value);
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (d) {
    FIELDS.forEach(f => $(f).value = d[f] || '');
    points = d.points || [];
    (d.asistentes && d.asistentes.length ? d.asistentes : ['']).forEach(a => addAsistente(a));
  } else {
    addAsistente();
    setNow();
  }
  render();
  if (points.length > 1) map.fitBounds(L.latLngBounds(points), {padding: [30, 30]});
}
function setNow() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  $('fecha').value = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
  $('hora').value = `${p(n.getHours())}:${p(n.getMinutes())}`;
}
FIELDS.forEach(f => $(f).addEventListener('input', save));
$('new').onclick = () => {
  if (!confirm('¿Empezar un informe nuevo? Se borrarán los datos actuales.')) return;
  FIELDS.forEach(f => $(f).value = '');
  $('asistentes').innerHTML = ''; addAsistente();
  points = []; setNow(); render(); save();
};

/* ---------- Exportar JPG ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitTiles() {
  await sleep(300);
  for (let i = 0; i < 30; i++) {
    if ([...document.querySelectorAll('#map .leaflet-tile')].every(t => t.complete)) return;
    await sleep(150);
  }
}
function setMsg(t) { $('msg').textContent = t; }

function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let cur = '';
    par.split(/\s+/).forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) cur = t;
      else {
        if (cur) out.push(cur);
        while (ctx.measureText(w).width > maxW) {
          let k = w.length; while (k > 1 && ctx.measureText(w.slice(0, k)).width > maxW) k--;
          out.push(w.slice(0, k)); w = w.slice(k);
        }
        cur = w;
      }
    });
    out.push(cur);
  });
  return out;
}
async function geocode(p) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 7000);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=es&lat=${p[0]}&lon=${p[1]}`, {signal: ac.signal});
    if (!r.ok) return null;
    const j = await r.json();
    return j.address || null;
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}
const fmtCoord = p => `${p[0].toFixed(5)}, ${p[1].toFixed(5)}`;

function routePointAt(fr) {
  if (points.length === 1) return points[0];
  const segs = []; let tot = 0;
  for (let i = 1; i < points.length; i++) { const d = map.distance(points[i - 1], points[i]); segs.push(d); tot += d; }
  if (!tot) return points[0];
  let t = fr * tot;
  for (let i = 0; i < segs.length; i++) {
    if (t <= segs[i] || i === segs.length - 1) {
      const k = segs[i] ? Math.min(1, t / segs[i]) : 0, a = points[i], b = points[i + 1];
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    }
    t -= segs[i];
  }
}
function parseAddr(a) {
  const first = keys => { for (const k of keys) if (a[k]) return a[k]; return ''; };
  const provincia = (a.state || a.region || '').replace(/^provincia\s+(de\s+)?/i, '').trim();
  let canton = (a.county || '').replace(/^cant[oó]n\s+(de\s+)?/i, '').trim();
  const barrio = first(['neighbourhood', 'quarter', 'hamlet', 'suburb']);
  let distrito = first(['city_district', 'municipality', 'town', 'village']);
  if (!distrito && a.suburb && a.suburb !== barrio) distrito = a.suburb;
  if (!canton) canton = a.city || '';
  else if (!distrito && a.city && a.city !== canton) distrito = a.city;
  distrito = distrito.replace(/^distrito\s+(de\s+)?/i, '').trim();
  return {barrio, distrito, canton, provincia};
}
const uniq = arr => arr.filter((v, i) => v && arr.indexOf(v) === i);
function rango(list) {
  if (!list.length) return '';
  if (list.length === 1) return list[0];
  const mid = list.slice(1, -1);
  return `de ${list[0]} a ${list[list.length - 1]}` + (mid.length ? ` (pasando por ${mid.join(', ')})` : '');
}
async function describeRoute() {
  const km = totalKm();
  const n = points.length === 1 ? 1 : Math.max(2, Math.min(7, Math.ceil(km / 1.5) + 1));
  const res = [];
  for (let i = 0; i < n; i++) {
    setMsg(`Buscando ubicación de la ruta (${i + 1}/${n})...`);
    if (i) await sleep(1100);
    const a = await geocode(routePointAt(n === 1 ? 0 : i / (n - 1)));
    if (a) res.push(parseAddr(a));
  }
  setMsg('Generando imagen...');
  return {
    coords: fmtCoord(routePointAt(0.5)),
    found: res.length > 0,
    barrio: rango(uniq(res.map(r => r.barrio))),
    distrito: rango(uniq(res.map(r => r.distrito))),
    canton: rango(uniq(res.map(r => r.canton))),
    provincia: rango(uniq(res.map(r => r.provincia)))
  };
}
function fmtFecha(v) { if (!v) return '—'; const [y, m, d] = v.split('-'); return `${d}/${m}/${y}`; }

async function buildJpg() {
  if (points.length > 1) map.fitBounds(L.latLngBounds(points), {padding: [30, 30], animate: false});
  else if (points.length === 1) map.setView(points[0], 16, {animate: false});
  await waitTiles();

  const info = points.length ? await describeRoute() : null;

  const W = 1200, P = 40, IW = W - P * 2;
  const mapEl = $('map'), r = mapEl.getBoundingClientRect();
  const s = IW / r.width, MH = Math.round(r.height * s);
  const measure = document.createElement('canvas').getContext('2d');

  const val = id => $(id).value.trim() || '—';
  const pairs = [['Fecha', fmtFecha($('fecha').value), 'Hora', val('hora')],
                 ['Cantón', val('canton'), 'Distrito', val('distrito')],
                 ['Unidad patrulla', val('unidad'), 'Oficial chofer', val('chofer')]];
  const asis = asistentes();
  measure.font = '28px sans-serif';
  const asisLines = wrap(measure, asis.length ? asis.join(', ') : '—', IW);
  const notes = $('notas').value.trim();
  const noteLines = wrap(measure, notes || 'Sin anotaciones.', IW);

  const HEAD = 100, ROW = 84, LH = 36;
  const hInfo = pairs.length * ROW + 30 + asisLines.length * LH + 20;
  const hMap = 56 + MH + 24;
  const hNotes = 56 + noteLines.length * LH + 24;
  measure.font = '24px sans-serif';
  const locRows = [];
  if (info) {
    locRows.push(['Coordenadas', info.coords]);
    if (info.found && (info.barrio || info.distrito || info.canton || info.provincia)) {
      if (info.barrio) locRows.push(['Sector/barrio', info.barrio]);
      if (info.distrito) locRows.push(['Distrito', info.distrito]);
      if (info.canton) locRows.push(['Cantón', info.canton]);
      if (info.provincia) locRows.push(['Provincia', info.provincia]);
    } else locRows.push(['Ubicación', 'No disponible (sin conexión)']);
  }
  const rows = locRows.map(([label, text]) => ({label, lines: wrap(measure, text, IW - 230)}));
  const hLoc = rows.length ? 44 + rows.reduce((a, r) => a + r.lines.length * 30 + 6, 0) + 14 : 0;
  const H = HEAD + 24 + hInfo + hMap + hLoc + hNotes + 56;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#1c2b3a'; ctx.fillRect(0, 0, W, HEAD);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif';
  ctx.fillText('INFORME DE RECORRIDO', P, 64);

  let y = HEAD + 24;
  const colW = (IW - 30) / 2;
  pairs.forEach(row => {
    [[row[0], row[1], P], [row[2], row[3], P + colW + 30]].forEach(([l, v, x]) => {
      ctx.fillStyle = '#5d6b78'; ctx.font = '22px sans-serif'; ctx.fillText(l, x, y + 24);
      ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 30px sans-serif';
      let t = v; while (ctx.measureText(t).width > colW && t.length > 1) t = t.slice(0, -1);
      ctx.fillText(t === v ? v : t + '…', x, y + 60);
    });
    y += ROW;
  });
  ctx.fillStyle = '#5d6b78'; ctx.font = '22px sans-serif';
  ctx.fillText(asis.length > 1 ? 'Oficiales asistentes' : 'Oficial asistente', P, y + 24);
  ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 28px sans-serif';
  asisLines.forEach((t, i) => ctx.fillText(t, P, y + 62 + i * LH));
  y += 30 + asisLines.length * LH + 20;

  ctx.strokeStyle = '#d5dbe1'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke();
  ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText('Mapa del recorrido', P, y + 42);
  ctx.textAlign = 'right'; ctx.font = '26px sans-serif'; ctx.fillStyle = '#5d6b78';
  ctx.fillText(`${points.length} puntos · ${totalKm().toFixed(2)} km`, W - P, y + 42);
  ctx.textAlign = 'left';
  const my = y + 56;

  ctx.save();
  ctx.beginPath(); ctx.rect(P, my, IW, MH); ctx.clip();
  ctx.fillStyle = '#e8ecef'; ctx.fillRect(P, my, IW, MH);
  const conts = [...mapEl.querySelectorAll('.leaflet-tile-pane .leaflet-tile-container')]
    .sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0));
  conts.forEach(cont => cont.querySelectorAll('img.leaflet-tile').forEach(img => {
    if (!img.complete || !img.naturalWidth) return;
    const b = img.getBoundingClientRect();
    ctx.drawImage(img, P + (b.left - r.left) * s, my + (b.top - r.top) * s, b.width * s + 1, b.height * s + 1);
  }));
  const proj = p => { const q = map.latLngToContainerPoint(p); return [P + q.x * s, my + q.y * s]; };
  if (points.length > 1) {
    ctx.strokeStyle = '#d63a2f'; ctx.lineWidth = 5 * s; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    points.forEach((p, i) => { const [x, yy] = proj(p); i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); });
    ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  points.forEach((p, i) => {
    const [x, yy] = proj(p);
    ctx.fillStyle = i === 0 ? '#1f8a4c' : (i === points.length - 1 && points.length > 1 ? '#d63a2f' : '#2b5d8c');
    ctx.beginPath(); ctx.arc(x, yy, 13 * s, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2 * s; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${13 * s}px sans-serif`;
    ctx.fillText(String(i + 1), x, yy + s);
  });
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = '#d5dbe1'; ctx.lineWidth = 2; ctx.strokeRect(P, my, IW, MH);

  y = my + MH + 24;
  if (rows.length) {
    ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 28px sans-serif';
    ctx.fillText('Ubicación aproximada de la ruta', P, y + 28);
    y += 44;
    rows.forEach(r => {
      ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#5d6b78';
      ctx.fillText(r.label, P, y + 22);
      ctx.font = '24px sans-serif'; ctx.fillStyle = '#1c2b3a';
      r.lines.forEach((t, i) => ctx.fillText(t, P + 230, y + 22 + i * 30));
      y += r.lines.length * 30 + 6;
    });
    y += 14;
  }
  ctx.strokeStyle = '#d5dbe1';
  ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke();
  ctx.fillStyle = '#1c2b3a'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText('Anotaciones', P, y + 42);
  ctx.font = '28px sans-serif'; ctx.fillStyle = notes ? '#1c2b3a' : '#5d6b78';
  noteLines.forEach((t, i) => ctx.fillText(t, P, y + 56 + 30 + i * LH));

  ctx.fillStyle = '#5d6b78'; ctx.font = '20px sans-serif';
  const now = new Date();
  ctx.fillText(`Generado ${now.toLocaleString('es-CR')} · Mapa © OpenStreetMap`, P, H - 22);

  return new Promise((res, rej) => {
    try { c.toBlob(b => b ? res(b) : rej(new Error('vacío')), 'image/jpeg', 0.92); } catch (e) { rej(e); }
  });
}

function fileName() {
  const f = $('fecha').value || 'sin-fecha', h = ($('hora').value || '').replace(':', '');
  return `informe-recorrido-${f}${h ? '-' + h : ''}.jpg`;
}

async function exportar(modo) {
  const btns = [$('save'), $('share')];
  btns.forEach(b => b.disabled = true);
  setMsg('Generando imagen...');
  try {
    const blob = await buildJpg();
    const file = new File([blob], fileName(), {type: 'image/jpeg'});
    if (modo === 'share') {
      try { await navigator.share({files: [file], title: 'Informe de recorrido'}); setMsg('Listo.'); }
      catch (e) { setMsg(e.name === 'AbortError' ? '' : 'No se pudo compartir.'); }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      setMsg('Imagen guardada: ' + file.name);
    }
  } catch (e) {
    setMsg('No se pudo generar la imagen. Verifica la conexión para cargar el mapa e intenta de nuevo.');
  }
  btns.forEach(b => b.disabled = false);
}
$('save').onclick = () => exportar('save');
$('share').onclick = () => exportar('share');
try {
  const t = new File([''], 't.jpg', {type: 'image/jpeg'});
  if (navigator.canShare && navigator.canShare({files: [t]})) $('share').hidden = false;
} catch (e) {}

load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
